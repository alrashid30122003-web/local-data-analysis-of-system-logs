[global]
   workgroup = WORKGROUP
   server string = Local Office Samba Server
   security = user
   map to guest = Bad User
   dns proxy = no
   log level = 1

[Public]
   path = /shares/public
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
   force create mode = 0666
   force directory mode = 0777

[HR_Share]
   path = /shares/hr
   browsable = yes
   writable = yes
   guest ok = no
   valid users = hr, hr_user, admin
   read only = no
   force create mode = 0660
   force directory mode = 0770

[Finance_Share]
   path = /shares/finance
   browsable = yes
   writable = yes
   guest ok = no
   valid users = finance, fin_user, admin
   read only = no
   force create mode = 0660
   force directory mode = 0770
